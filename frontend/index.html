<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粤采雷达 - GD-MedProcure-Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.43/dist/flexsearch.bundle.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' },
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .highlight { background: #fef08a; border-radius: 2px; padding: 0 2px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen" x-cloak x-data="radarApp()">

  <!-- ====== 顶部导航栏 ====== -->
  <header class="bg-gradient-to-r from-brand-800 via-brand-700 to-brand-600 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-5 sm:px-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center text-xl">📡</div>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight">粤采雷达</h1>
            <p class="text-brand-200 text-xs sm:text-sm">GD-MedProcure-Radar · 广东省医疗设备采购信息监测</p>
          </div>
        </div>
        <div class="text-xs text-brand-200 flex items-center gap-4">
          <span x-show="stats.total">共 <strong class="text-white" x-text="stats.total"></strong> 条记录</span>
          <span x-show="stats.lastUpdate">
            更新于 <strong class="text-white" x-text="stats.lastUpdate"></strong>
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- ====== 主体内容 ====== -->
  <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 space-y-5">

    <!-- 搜索栏 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-5">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" x-model="searchQuery"
               @input.debounce.300ms="doSearch()"
               placeholder="搜索项目编号、医院名称、项目名称..."
               class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition">
        <button x-show="searchQuery" @click="searchQuery=''; doSearch()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- 筛选区 + 统计 -->
    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">
      <div class="flex flex-wrap gap-3">
        <!-- 地区筛选 -->
        <select x-model="filterRegion" @change="applyFilters()"
                class="text-sm border border-gray-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
          <option value="">全部地区</option>
          <template x-for="r in aggregations.regions" :key="r.name">
            <option :value="r.name" x-text="r.name + ' (' + r.count + ')'"></option>
          </template>
        </select>
        <!-- 类目筛选 -->
        <select x-model="filterCategory" @change="applyFilters()"
                class="text-sm border border-gray-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
          <option value="">全部类目</option>
          <template x-for="c in aggregations.categories" :key="c.name">
            <option :value="c.name" x-text="c.name + ' (' + c.count + ')'"></option>
          </template>
        </select>
        <!-- 重置 -->
        <button x-show="filterRegion || filterCategory || searchQuery" @click="resetFilters()"
                class="text-sm text-brand-600 hover:text-brand-800 px-3 py-2 rounded-lg hover:bg-brand-50 transition">
          重置筛选
        </button>
      </div>
      <div class="text-sm text-gray-500">
        找到 <strong class="text-gray-800" x-text="filteredResults.length"></strong> 条结果
      </div>
    </div>

    <!-- ====== 结果展示区 ====== -->
    <div class="space-y-3">
      <!-- 加载中 -->
      <div x-show="loading" class="text-center py-20">
        <div class="inline-block w-8 h-8 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
        <p class="mt-3 text-gray-500 text-sm">正在加载数据...</p>
      </div>

      <!-- 空状态 -->
      <div x-show="!loading && filteredResults.length === 0" class="text-center py-20 fade-in">
        <div class="text-5xl mb-3">🔍</div>
        <p class="text-gray-500">未找到匹配的采购项目</p>
        <p class="text-gray-400 text-sm mt-1">试试调整搜索关键词或筛选条件</p>
      </div>

      <!-- 结果卡片列表 -->
      <template x-for="item in paginatedResults" :key="item.id">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md hover:border-brand-200 transition-all p-4 sm:p-5 fade-in" x-data="{ expanded: false }">
          <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <!-- 项目名称 -->
              <h3 class="text-sm sm:text-base font-semibold text-gray-900 leading-snug"
                  x-html="highlightText(item.project_name)"></h3>
              <!-- 元信息 -->
              <div class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-500">
                <span class="flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                  <span x-text="item.project_no"></span>
                </span>
                <span class="flex items-center gap-1" x-show="item.hospital">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                  <span x-html="highlightText(item.hospital)"></span>
                </span>
                <span class="flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  <span x-text="item.region"></span>
                </span>
                <span class="flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                  <span x-text="item.publish_date"></span>
                </span>
              </div>
            </div>
            <!-- 右侧标签和金额 -->
            <div class="flex flex-row sm:flex-col items-center sm:items-end gap-2 sm:gap-1 shrink-0">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                    :class="categoryColor(item.category)" x-text="item.category"></span>
              <span x-show="item.budget" class="text-sm font-bold text-brand-700 whitespace-nowrap">
                ¥<span x-text="formatBudget(item.budget)"></span> <span class="text-xs font-normal text-gray-400">万元</span>
              </span>
              <a :href="item.url || '#'" target="_blank" rel="noopener"
                 class="text-xs text-brand-600 hover:text-brand-800 underline underline-offset-2">
                查看详情 →
              </a>
            </div>
          </div>
          <!-- 公告内容展开区 -->
          <div x-show="item.content" class="mt-3 pt-3 border-t border-gray-100">
            <button @click="expanded = !expanded"
                    class="text-xs text-brand-600 hover:text-brand-800 flex items-center gap-1 transition">
              <svg class="w-3.5 h-3.5 transition-transform" :class="{ 'rotate-90': expanded }" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              <span x-text="expanded ? '收起公告内容' : '查看公告内容'"></span>
            </button>
            <div x-show="expanded" x-collapse
                 class="mt-2 text-xs text-gray-600 leading-relaxed bg-gray-50 rounded-lg p-3 max-h-60 overflow-y-auto"
                 x-text="item.content"></div>
          </div>
        </div>
      </template>
    </div>

    <!-- ====== 分页 ====== -->
    <div x-show="totalPages > 1" class="flex items-center justify-between bg-white rounded-xl shadow-sm border border-gray-200 px-4 py-3">
      <div class="text-sm text-gray-500">
        第 <strong x-text="currentPage"></strong> / <span x-text="totalPages"></span> 页
      </div>
      <div class="flex items-center gap-1">
        <button @click="goPage(1)" :disabled="currentPage <= 1"
                class="px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">首页</button>
        <button @click="goPage(currentPage - 1)" :disabled="currentPage <= 1"
                class="px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">上一页</button>
        <!-- 页码按钮 -->
        <template x-for="p in visiblePages" :key="p">
          <button @click="goPage(p)"
                  class="w-9 h-9 text-sm rounded-lg border transition"
                  :class="p === currentPage ? 'bg-brand-600 text-white border-brand-600' : 'border-gray-200 hover:bg-gray-50'"
                  x-text="p"></button>
        </template>
        <button @click="goPage(currentPage + 1)" :disabled="currentPage >= totalPages"
                class="px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">下一页</button>
        <button @click="goPage(totalPages)" :disabled="currentPage >= totalPages"
                class="px-3 py-1.5 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">末页</button>
      </div>
    </div>

  </main>

  <!-- ====== 页脚 ====== -->
  <footer class="border-t border-gray-200 mt-10 py-6 text-center text-xs text-gray-400">
    <p>粤采雷达 GD-MedProcure-Radar · 数据来源：广东省政府采购网 / 广东省公共资源交易平台</p>
    <p class="mt-1">仅供信息参考，不构成任何商业建议</p>
  </footer>

  <!-- ====== Alpine.js 应用逻辑 ====== -->
  <script>
  function radarApp() {
    return {
      // 状态
      loading: true,
      allDocs: [],           // 全量索引文档
      fullData: {},          // 全量详情 { id: {...} }
      aggregations: { regions: [], categories: [], date_range: {}, budget_range: {} },
      searchIndex: null,     // FlexSearch 实例
      searchQuery: '',
      filterRegion: '',
      filterCategory: '',
      filteredResults: [],
      currentPage: 1,
      pageSize: 20,
      stats: { total: 0, lastUpdate: '' },

      // ========== 初始化 ==========
      async init() {
        try {
          // 并行加载三个数据文件
          const [indexRes, aggRes, dataRes] = await Promise.all([
            fetch('./data/search-index.json'),
            fetch('./data/aggregations.json'),
            fetch('./data/procurements.json'),
          ]);

          const indexDocs = await indexRes.json();
          const aggData = await aggRes.json();
          const fullDocs = await dataRes.json();

          // 存储聚合数据
          this.aggregations = aggData;
          this.stats.total = aggData.total || fullDocs.length;

          // 计算最后更新时间
          if (aggData.generated_at) {
            const d = new Date(aggData.generated_at);
            this.stats.lastUpdate = d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          } else if (fullDocs.length > 0) {
            this.stats.lastUpdate = fullDocs[0].publish_date || '';
          }

          // 构建详情查找表
          fullDocs.forEach(d => { this.fullData[d.project_id] = d; });

          // 存储索引文档
          this.allDocs = indexDocs;

          // 构建自定义搜索索引（解决 FlexSearch 中文分词兼容问题）
          const FIELDS = ['project_name', 'project_no', 'hospital', 'agency', 'category', 'raw_category'];
          this.searchIndexes = {};
          this.docLookup = {};

          // 文档查找表
          indexDocs.forEach(doc => { this.docLookup[doc.id] = doc; });

          // 每个字段构建 FlexSearch Index（forward 模式）
          FIELDS.forEach(field => {
            const idx = new FlexSearch.Index({
              tokenize: 'forward',
              resolution: 9,
              cache: 100,
            });
            indexDocs.forEach(doc => {
              const val = (doc[field] || '').toString().trim();
              if (val) idx.add(doc.id, val);
            });
            this.searchIndexes[field] = idx;
          });

          // 初始显示全部
          this.filteredResults = indexDocs;

        } catch (err) {
          console.error('数据加载失败:', err);
          // 尝试兼容旧路径
          try {
            const fallback = await fetch('./search-index.json');
            if (fallback.ok) {
              const docs = await fallback.json();
              this.allDocs = docs;
              this.filteredResults = docs;
              this.stats.total = docs.length;
              this.docLookup = {};
              docs.forEach(doc => { this.docLookup[doc.id] = doc; });
              const FIELDS = ['project_name', 'project_no', 'hospital', 'agency', 'category', 'raw_category'];
              this.searchIndexes = {};
              FIELDS.forEach(field => {
                const idx = new FlexSearch.Index({ tokenize: 'forward', resolution: 9, cache: 100 });
                docs.forEach(doc => {
                  const val = (doc[field] || '').toString().trim();
                  if (val) idx.add(doc.id, val);
                });
                this.searchIndexes[field] = idx;
              });
            }
          } catch (e2) {
            console.error('备用路径也失败:', e2);
          }
        } finally {
          this.loading = false;
        }
      },

      // ========== 搜索 ==========
      doSearch() {
        this.currentPage = 1;
        if (!this.searchQuery.trim()) {
          // 无搜索词时，直接应用筛选（避免与 applyFilters 递归）
          this.filteredResults = this.applyFilterOn(this.allDocs);
          return;
        }
        const query = this.searchQuery.trim();
        const matchedIds = new Set();

        // 1. FlexSearch Index 搜索（处理英文/数字/拼音前缀）
        Object.values(this.searchIndexes).forEach(idx => {
          try {
            const ids = idx.search(query, { limit: this.allDocs.length });
            ids.forEach(id => matchedIds.add(id));
          } catch(e) { /* ignore */ }
        });

        // 2. 中文字串匹配补充（解决 FlexSearch 对长中文子串的局限）
        //    遍历全部文档，检查 query 是否出现在任一搜索字段中
        if (matchedIds.size === 0 || /[\u4e00-\u9fff]/.test(query)) {
          const q = query.toLowerCase();
          this.allDocs.forEach(doc => {
            if (matchedIds.has(doc.id)) return;
            const haystack = [
              doc.project_name, doc.project_no, doc.hospital,
              doc.agency, doc.category, doc.raw_category
            ].join(' ').toLowerCase();
            if (haystack.includes(q)) matchedIds.add(doc.id);
          });
        }

        // 从 allDocs 中提取匹配的文档
        let searched = this.allDocs.filter(d => matchedIds.has(d.id));
        // 再叠加筛选
        this.filteredResults = this.applyFilterOn(searched);
      },

      // ========== 筛选 ==========
      applyFilters() {
        this.currentPage = 1;
        // 统一走 doSearch 逻辑（同时处理搜索 + 筛选）
        this.doSearch();
      },

      applyFilterOn(docs) {
        let result = docs;
        if (this.filterRegion) {
          result = result.filter(d => d.region === this.filterRegion);
        }
        if (this.filterCategory) {
          result = result.filter(d => d.category === this.filterCategory);
        }
        return result;
      },

      resetFilters() {
        this.searchQuery = '';
        this.filterRegion = '';
        this.filterCategory = '';
        this.currentPage = 1;
        this.filteredResults = this.allDocs;
      },

      // ========== 分页 ==========
      get totalPages() {
        return Math.max(1, Math.ceil(this.filteredResults.length / this.pageSize));
      },
      get paginatedResults() {
        const start = (this.currentPage - 1) * this.pageSize;
        return this.filteredResults.slice(start, start + this.pageSize);
      },
      get visiblePages() {
        const total = this.totalPages;
        const cur = this.currentPage;
        const pages = [];
        let start = Math.max(1, cur - 2);
        let end = Math.min(total, cur + 2);
        if (end - start < 4) {
          if (start === 1) end = Math.min(total, start + 4);
          else start = Math.max(1, end - 4);
        }
        for (let i = start; i <= end; i++) pages.push(i);
        return pages;
      },
      goPage(p) {
        if (p >= 1 && p <= this.totalPages) {
          this.currentPage = p;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      },

      // ========== 辅助函数 ==========
      formatBudget(val) {
        if (val == null) return '';
        return Number(val).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      },
      categoryColor(cat) {
        const map = {
          '医学影像设备': 'bg-blue-100 text-blue-800',
          '检验设备': 'bg-purple-100 text-purple-800',
          '手术设备': 'bg-red-100 text-red-800',
          '监护设备': 'bg-green-100 text-green-800',
          '呼吸设备': 'bg-teal-100 text-teal-800',
          '康复设备': 'bg-orange-100 text-orange-800',
          '消毒设备': 'bg-yellow-100 text-yellow-800',
        };
        return map[cat] || 'bg-gray-100 text-gray-700';
      },
      highlightText(text) {
        if (!this.searchQuery.trim() || !text) return text || '';
        const q = this.searchQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        try {
          const re = new RegExp(`(${q})`, 'gi');
          return text.replace(re, '<span class="highlight">$1</span>');
        } catch { return text; }
      },
    };
  }
  </script>
</body>
</html>
